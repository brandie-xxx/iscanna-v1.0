name: Flutter

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: Also build iOS (unsigned, macOS runner)
        type: boolean
        default: false

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  check-and-build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed -l 120 lib test
      - run: flutter analyze
      - run: flutter test

      # Release build, one APK per CPU type: far smaller than a universal debug APK.
      # Signed with the runner's debug key (fine for sideloading, not for the Play Store).
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      # Almost every Android phone from the last ~8 years.
      - uses: actions/upload-artifact@v4
        with:
          name: iscanna-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # Older 32-bit phones only.
      - uses: actions/upload-artifact@v4
        with:
          name: iscanna-apk-older-phones
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

  build-ios:
    # macOS minutes are billed at a higher rate, so this only runs on request.
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
