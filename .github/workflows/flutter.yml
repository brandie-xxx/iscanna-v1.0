name: Flutter

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      android:
        description: Build Android APKs
        type: boolean
        default: true
      play_bundle:
        description: Build the Google Play bundle (.aab, needs the upload-key secrets)
        type: boolean
        default: false
      ios:
        description: Also build iOS (unsigned, macOS runner)
        type: boolean
        default: false

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  checks-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed -l 120 lib test
      - run: flutter analyze
      - run: flutter test

      # Upload key for Google Play, from repository secrets (see docs/release/checklist.md).
      # Without the secrets, APKs fall back to the runner's debug key (fine for sideloading only).
      - name: Set up the upload key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "Upload key found: release builds are signed for Google Play."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: builds use the debug key and can't go to Google Play."
          fi

      # APKs are only built on request (Actions → Flutter → Run workflow), not on every push.
      # Release build, one APK per CPU type: far smaller than a universal debug APK.
      - name: Build release APKs
        if: github.event_name == 'workflow_dispatch' && inputs.android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        if: github.event_name == 'workflow_dispatch' && inputs.android
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      # Almost every Android phone from the last ~8 years.
      - if: github.event_name == 'workflow_dispatch' && inputs.android
        uses: actions/upload-artifact@v4
        with:
          name: iscanna-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # Older 32-bit phones only.
      - if: github.event_name == 'workflow_dispatch' && inputs.android
        uses: actions/upload-artifact@v4
        with:
          name: iscanna-apk-older-phones
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      # Google Play takes an app bundle signed with the upload key; Play then signs per device.
      - name: Build Google Play bundle
        if: github.event_name == 'workflow_dispatch' && inputs.play_bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::error::The Play bundle needs the upload key. Add the ANDROID_* secrets first (docs/release/checklist.md)."
            exit 1
          fi
          flutter build appbundle --release
          ls -lh build/app/outputs/bundle/release/*.aab

      - if: github.event_name == 'workflow_dispatch' && inputs.play_bundle
        uses: actions/upload-artifact@v4
        with:
          name: iscanna-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    # macOS minutes are billed at a higher rate, so this only runs on request.
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
